name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'context/LAUNCH_PROOFS.json'
      - 'context/PROJECT_STATUS.json'
      - 'index.html'
      - 'package*.json'
      - 'deno.lock'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'supabase/**'
      - 'vite.config.js'

# Finish a promotion before admitting another commit; never cancel midway.
concurrency:
  group: cloudflare-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  release:
    name: Verify, stage, and promote identical bytes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_APP_BASE_PATH: /
      VITE_CANONICAL_URL: https://promogrind.bet/
      VITE_DOMAIN: promogrind.bet
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PG_FEATURE_PROMO_CHAT: ${{ secrets.VITE_PG_FEATURE_PROMO_CHAT }}
      VITE_PG_FEATURE_PROMO_ADVISOR: ${{ secrets.VITE_PG_FEATURE_PROMO_ADVISOR }}
      VITE_PG_FEATURE_AI_ACTION_PLAN: ${{ secrets.VITE_PG_FEATURE_AI_ACTION_PLAN }}
      VITE_PG_FEATURE_AI_SCAN: ${{ secrets.VITE_PG_FEATURE_AI_SCAN }}
      VITE_PG_FEATURE_STACK_BUILDER: ${{ secrets.VITE_PG_FEATURE_STACK_BUILDER }}
      VITE_PG_FEATURE_PUSH_ALERTS: ${{ secrets.VITE_PG_FEATURE_PUSH_ALERTS }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify complete local release gate
        run: npm run verify:launch-local
      - name: Verify required CI for this exact candidate
        run: node scripts/check-release-candidate.mjs --sha "$GITHUB_SHA" --json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build release artifact once
        run: |
          npm run build:pages
          node --input-type=module -e "import { prepareCloudflareArtifact } from './scripts/lib/cloudflare-pages-release.mjs'; prepareCloudflareArtifact('dist');"
      - name: Install reviewed deployment CLI
        run: npm install --global --ignore-scripts wrangler@4.80.0
      - name: Verify deployment account
        run: wrangler whoami > /dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy and verify stable staging
        run: |
          node scripts/deploy-cloudflare-pages.mjs --environment staging --apply --dist dist --commit "$GITHUB_SHA"
          npm run verify:web-live -- --url https://staging.promogrind.bet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Promote verified staging artifact
        run: |
          RECEIPT=$(node --input-type=module -e "import fs from 'node:fs'; const d='artifacts/cloudflare-pages'; const f=fs.readdirSync(d).filter(n=>/^staging-.*\\.json$/.test(n)&&!n.includes('-dns-')).sort().at(-1); if(!f)process.exit(1); console.log(d+'/'+f);")
          node scripts/deploy-cloudflare-pages.mjs --environment production --apply --dist dist --commit "$GITHUB_SHA" --staging-receipt "$RECEIPT"
          npm run verify:web-live -- --url https://promogrind.bet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Preserve deployment and rollback receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-release-${{ github.sha }}
          path: |
            artifacts/cloudflare-pages
            dist/_release.json
          if-no-files-found: warn
