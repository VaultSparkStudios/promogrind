<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromoGrind</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #0a0e17;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .header {
      background: #0f1520;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { font-size: 15px; font-weight: 700; color: #4ade80; letter-spacing: -0.5px; }
    .header-sub { font-size: 9px; color: #64748b; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .badge { font-size: 8px; padding: 2px 7px; background: #4ade8012; border: 1px solid #4ade8030; border-radius: 50px; color: #4ade80; font-weight: 700; }

    .section { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
    .section-title { font-size: 8px; color: #475569; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }

    .book-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 9px;
      font-weight: 700;
      border: 1px solid;
      margin-bottom: 8px;
    }
    .no-book { color: #475569; font-size: 10px; }

    .calc-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 3px;
      background: #161d2a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.1s, border-color 0.1s;
    }
    .calc-btn:hover { background: #1c2536; border-color: #334155; }
    .calc-btn .arrow { color: #64748b; font-size: 10px; }
    .calc-btn .desc { font-size: 9px; color: #64748b; font-weight: 400; margin-top: 1px; }

    .open-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #4ade8015;
      border: 1px solid #4ade8030;
      border-radius: 6px;
      color: #4ade80;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: background 0.1s;
    }
    .open-btn:hover { background: #4ade8020; }

    .footer {
      padding: 8px 12px;
      text-align: center;
      font-size: 9px;
      color: #334155;
    }

    #book-section { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-logo">⚡ PromoGrind</div>
      <div class="header-sub">Sportsbook Calculator Suite</div>
    </div>
    <div class="badge">FREE</div>
  </div>

  <div class="section" id="book-section">
    <div class="section-title">Current Book</div>
    <div id="book-badge" class="book-badge"></div>
    <div id="suggested-title" class="section-title" style="margin-top:4px;">Suggested for this book</div>
    <div id="suggested-calcs"></div>
  </div>

  <div class="section">
    <div class="section-title">All Calculators</div>

    <button class="calc-btn" data-calc="bonus-bet">
      <div>
        <div>🎫 Bonus Bet Converter</div>
        <div class="desc">Turn free bets into guaranteed cash</div>
      </div>
      <span class="arrow">→</span>
    </button>

    <button class="calc-btn" data-calc="profit-boost">
      <div>
        <div>🚀 Profit Boost</div>
        <div class="desc">Lock in boosted odds profit</div>
      </div>
      <span class="arrow">→</span>
    </button>

    <button class="calc-btn" data-calc="first-bet">
      <div>
        <div>🛡️ First Bet Safety Net</div>
        <div class="desc">Hedge your insurance bet</div>
      </div>
      <span class="arrow">→</span>
    </button>

    <button class="calc-btn" data-calc="no-vig">
      <div>
        <div>📐 No-Vig Fair Odds</div>
        <div class="desc">Remove the juice from any line</div>
      </div>
      <span class="arrow">→</span>
    </button>

    <button class="calc-btn" data-calc="ev">
      <div>
        <div>📈 +EV Calculator</div>
        <div class="desc">Find positive expected value bets</div>
      </div>
      <span class="arrow">→</span>
    </button>

    <button class="calc-btn" data-calc="arb-2way">
      <div>
        <div>⚖️ Arbitrage</div>
        <div class="desc">Guaranteed profit across books</div>
      </div>
      <span class="arrow">→</span>
    </button>
  </div>

  <div class="section">
    <button class="open-btn" id="open-full">Open Full PromoGrind (27 Tools) →</button>
  </div>

  <div class="footer">
    Free · No ads · 27 calculators · vaultsparkstudios.com/promogrind/
  </div>

  <script src="popup.js"></script>
</body>
</html>
