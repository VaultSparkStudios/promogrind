<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>MobileBottomNav — CANON-041 visual fixture</title>
<style>
  /* Palette tokens — dark (default) */
  :root {
    --bg: #0a0e17;
    --s1: #0f1520;
    --s2: #161d2a;
    --bd: #1e293b;
    --ac: #60a5fa;
    --gn: #4ade80;
    --mt: #7a8fa8;
    --tx: #e2e8f0;
    --font: 'JetBrains Mono','SF Mono','Fira Code',monospace;
  }
  [data-theme="light"] {
    --bg: #f8fafc;
    --s1: #ffffff;
    --s2: #f1f5f9;
    --bd: #cbd5e1;
    --ac: #1d4ed8;
    --gn: #166534;
    --mt: #475569;
    --tx: #0f172a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--tx); font-family: var(--font); height: 844px; width: 390px; overflow: hidden; }

  .pg-mobile-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--s2) 94%, transparent) 0%, color-mix(in srgb, var(--s1) 99%, transparent) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--bd);
    display: flex;
    z-index: 100;
    padding: 6px 0 0;
    box-shadow: 0 -1px 0 rgba(255,255,255,0.04), 0 -12px 32px rgba(0,0,0,0.28);
  }

  .pg-mobile-nav button {
    flex: 1;
    min-height: 44px;
    padding: 6px 2px 4px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    transition: color 0.15s;
    color: var(--mt);
  }

  .pg-mobile-nav button.active {
    color: var(--ac);
  }

  .pg-mobile-nav button .bar {
    display: none;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 2px;
    border-radius: 0 0 2px 2px;
    background: var(--ac);
    box-shadow: 0 0 8px color-mix(in srgb, var(--ac) 53%, transparent);
  }
  .pg-mobile-nav button.active .bar { display: block; }

  .pg-mobile-nav button .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.65;
    transition: opacity 0.15s, filter 0.15s;
  }
  .pg-mobile-nav button.active .icon {
    opacity: 1;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--ac) 40%, transparent));
  }

  .pg-mobile-nav button .lbl {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
    line-height: 1;
  }
  .pg-mobile-nav button.active .lbl { font-weight: 700; }

  /* Main content area */
  .content {
    padding: 20px 16px;
    padding-bottom: 88px;
  }
  .content h1 { font-size: 20px; color: var(--gn); margin-bottom: 4px; letter-spacing: -0.5px; }
  .content p { font-size: 11px; color: var(--mt); margin-bottom: 16px; }
  .card {
    background: var(--s1);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 12px; font-weight: 700; color: var(--tx); margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--mt); }

  /* Theme toggle button */
  #theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 8px 12px;
    background: var(--s1);
    border: 1px solid var(--bd);
    border-radius: 8px;
    color: var(--tx);
    font-family: var(--font);
    font-size: 10px;
    cursor: pointer;
    z-index: 999;
  }
</style>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>

  <div class="content">
    <h1>PromoGrind</h1>
    <p>Dashboard — mobile nav CANON-041 visual fixture</p>

    <div class="card">
      <div class="card-title">Today's Promos</div>
      <div class="card-desc">3 active opportunities · Best EV: FanDuel +$42</div>
    </div>
    <div class="card">
      <div class="card-title">Operator Score</div>
      <div class="card-desc">82/100 — Elite · 14-day streak</div>
    </div>
    <div class="card">
      <div class="card-title">P/L This Week</div>
      <div class="card-desc">+$214.50 realized · 3 open bets</div>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="pg-mobile-nav" role="navigation" aria-label="Main navigation">

    <button class="active" aria-label="Home" aria-current="page">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 9.5L10 3l7 6.5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M7.5 18V12.5h5V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="lbl">Home</span>
    </button>

    <button aria-label="Convert">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 7h10M5 7L8 4M5 7l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 13H5m10 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="lbl">Convert</span>
    </button>

    <button aria-label="Calc">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 7h2M11 7h2M7 10h2M11 10h2M7 13h2M11 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">Calc</span>
    </button>

    <button aria-label="Track">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <polyline points="3,14 7,9 11,12 17,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 17h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">Track</span>
    </button>

    <button aria-label="Live">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="3" fill="currentColor"/>
          <path d="M5.5 14.5A6.5 6.5 0 0 1 5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M14.5 5.5a6.5 6.5 0 0 1 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M3 17A9.5 9.5 0 0 1 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          <path d="M17 3a9.5 9.5 0 0 1 0 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </span>
      <span class="lbl">Live</span>
    </button>

    <button aria-label="Learn">
      <span class="bar"></span>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 4L2 8l8 4 8-4-8-4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 8v5c0 1.5 3.5 3 8 3s8-1.5 8-3V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M18 8v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">Learn</span>
    </button>

  </nav>

  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }
    // Tab switching demo
    document.querySelectorAll('.pg-mobile-nav button').forEach(function(btn, i) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.pg-mobile-nav button').forEach(function(b) {
          b.classList.remove('active');
          b.removeAttribute('aria-current');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-current', 'page');
      });
    });
  </script>
</body>
</html>
